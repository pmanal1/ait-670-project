<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIT-670 Project</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <nav class="sidebar-nav">
      <a href="#" class="sidebar-item" data-view="coach">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-sparkles-2"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M14 6a9.3 9.3 0 0 0 1.516 -.546c.911 -.438 1.494 -1.015 1.937 -1.932c.207 -.428 .382 -.928 .547 -1.522c.165 .595 .34 1.095 .547 1.521c.443 .918 1.026 1.495 1.937 1.933c.426 .205 .925 .38 1.516 .546a9.3 9.3 0 0 0 -1.516 .547c-.911 .438 -1.494 1.015 -1.937 1.932a9 9 0 0 0 -.547 1.521c-.165 -.594 -.34 -1.095 -.547 -1.521c-.443 -.918 -1.026 -1.494 -1.937 -1.932a9 9 0 0 0 -1.516 -.547" /><path d="M3 14a21 21 0 0 0 1.652 -.532c2.542 -.953 3.853 -2.238 4.816 -4.806a20 20 0 0 0 .532 -1.662a20 20 0 0 0 .532 1.662c.963 2.567 2.275 3.853 4.816 4.806q .75 .28 1.652 .532a21 21 0 0 0 -1.652 .532c-2.542 .953 -3.854 2.238 -4.816 4.806a20 20 0 0 0 -.532 1.662a20 20 0 0 0 -.532 -1.662c-.963 -2.568 -2.275 -3.853 -4.816 -4.806a21 21 0 0 0 -1.652 -.532" /></svg>
        Coach
      </a>
      <a href="#" class="sidebar-item" data-view="workout">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-barbell"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M2 12h1" /><path d="M6 8h-2a1 1 0 0 0 -1 1v6a1 1 0 0 0 1 1h2" /><path d="M6 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1" /><path d="M9 12h6" /><path d="M15 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1" /><path d="M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2" /><path d="M22 12h-1" /></svg>
        Workout
      </a>
      <a href="#" class="sidebar-item" data-view="profile">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></svg>
        Profile
      </a>
    </nav>

    <hr class="sidebar-divider">

    <div class="chat-history">
      <h2 class="chat-history-title">Chat Sessions</h2>
      <ul class="chat-session-list" id="chat-session-list"></ul>
    </div>
  </aside>

  <main class="content">
    <section id="view-coach" class="view active">
      <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
          <div class="chat-empty-state" id="chat-empty-state">
            <h2 class="chat-empty-title">Coach</h2>
            <p class="chat-empty-subtitle">Ask me anything about your training.</p>
          </div>
        </div>

        <form class="chat-input-form" id="chat-form">
          <div class="chat-input-wrapper">
            <textarea
              id="chat-input"
              class="chat-input"
              rows="1"
              placeholder="Message Coach..."
              autocomplete="off"
            ></textarea>
            <button type="submit" class="chat-send-btn" id="chat-send-btn" aria-label="Send message">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l0 14" /><path d="M18 13l-6 6" /><path d="M6 13l6 6" /></svg>
            </button>
          </div>
          <p class="chat-disclaimer">Coach can make mistakes. Verify important information.</p>
        </form>
      </div>
    </section>
    <section id="view-workout" class="view">
      <h1 class="workout-title">Current Workout</h1>
      <div id="workout-list"></div>
      <button type="button" class="workout-complete-btn" id="workout-complete-btn" disabled>
        Complete Workout
      </button>
    </section>
    <section id="view-profile" class="view">
      <div id="profile-root"></div>
    </section>
  </main>

  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <button type="button" class="modal-close-btn" id="modal-close-btn" aria-label="Close modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-x"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></svg>
      </button>
      <p class="modal-content">Hello World</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
