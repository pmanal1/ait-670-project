# Install as /etc/nginx/sites-available/ait670.paulomanalo.dev and enable it
# from sites-enabled. This entire file must be included in the http context.
# Keep the password file outside the checkout and readable by Nginx workers.
limit_req_zone $binary_remote_addr zone=spotme_requests:10m rate=5r/s;

# The app enforces the shared AI budget after this proxy authenticates the
# request. limit_req runs before auth_basic, so it must only throttle clients
# here, not consume a shared allowance that anonymous traffic could exhaust.

# Browsers reuse Basic credentials. Reject writes from a different origin to
# prevent another website from submitting requests using that cached login.
# Origin-less clients (such as curl) still have to authenticate.
map "$request_method:$http_origin" $spotme_cross_origin_write {
    default 1;
    ~^(GET|HEAD|OPTIONS): 0;
    ~^[A-Z]+:$ 0;
    ~^[A-Z]+:https://ait670\.paulomanalo\.dev$ 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name ait670.paulomanalo.dev;
    return 301 https://ait670.paulomanalo.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ait670.paulomanalo.dev;

    ssl_certificate /etc/letsencrypt/live/ait670.paulomanalo.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ait670.paulomanalo.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Server-level authentication covers the UI, profile/workout JSON, and
    # every API method. Do not add auth_basic off in a child location.
    auth_basic "SpotMe private access";
    auth_basic_user_file /etc/nginx/spotme.htpasswd;

    limit_req zone=spotme_requests burst=20 nodelay;
    limit_req_status 429;

    if ($spotme_cross_origin_write) { return 403; }

    add_header Cache-Control "no-store" always;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app never needs the site's password.
        proxy_set_header Authorization "";
        proxy_read_timeout 120s;
    }
}
