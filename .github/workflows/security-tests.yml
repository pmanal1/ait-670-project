name: Security regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test proxy
        run: sudo apt-get update && sudo apt-get install -y nginx openssl
      - name: Test static isolation and private proxy access
        env:
          NGINX_BIN: /usr/sbin/nginx
        run: node --test tests/*.test.js
